name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[dev]" pyflakes
      - name: Audit resolved application dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --local --skip-editable
      - name: Lint
        run: python -m pyflakes agent buffer ingest output trigger config.py logwhisper_splash.py tests
      - name: Test
        run: python -m pytest -q
      - name: Smoke test installed wheel
        run: python tests/wheel_smoke.py

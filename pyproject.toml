[project]
name = "logwhisper"
version = "0.1.0"
description = "AI-Powered Live Log Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "PyYAML>=6.0.0",
    "python-dateutil>=2.9.0",
    "winotify>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
logwhisper = "agent:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["buffer", "ingest", "trigger", "agent", "output"]
namespaces = false
